name: Test Automation Workflow

on:
  schedule:
    - cron: 30 23 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Running Test Automation Framework with Maven
      run: mvn test -X -Dbrowser=chrome -DisLambadaTest=true -DisHeadless=false

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Log
        path: logs/

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Report
        path: report.html

    - name: Upload Execution Status 
      run: echo "Test Execution Completed"

   
